x-common-environment: &common_env
  TZ: Europe/Berlin

services:
  nginx:
    restart: unless-stopped
    image: nginx:stable-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./backend/staticfiles:/var/www/static
      - ./backend/media:/var/www/media # location for workbook images
      - ./frontend/public:/var/www/static/public
      - ./information:/information
    depends_on:
      - instaclone-backend
      - instaclone-frontend

  db:
    image: postgres:13
    environment:
      POSTGRES_HOST_AUTH_METHOD: "trust"
      <<: *common_env
    restart: always
    volumes:
      - postgres:/var/lib/postgresql/data/
      - ./scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: pgsty/minio:latest
    restart: always
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      <<: *common_env
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  instaclone-backend:
    build: ./backend
    restart: always
    environment:
      <<: *common_env
    volumes:
      - ./backend:/app
      - ./backend/staticfiles:/var/www/static
      - ./backend/media:/app/media # location for workbook images
      - ./scripts:/scripts
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file:
      - .env


  instaclone-frontend:
    build: "./frontend"
    restart: always
    volumes:
      - ./frontend:/app
      - ./frontend/public:/var/www/static/public
      - "/app/node_modules"

  redis:
    restart: always
    image: eqalpha/keydb:latest

volumes:
  postgres:
  minio_data:
