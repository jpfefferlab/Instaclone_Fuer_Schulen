---
# generate_secrets.yml
# Run ONCE before site.yml to generate and persist all deployment secrets.
# The resulting secrets.yml is kept locally (control machine only) and is
# intentionally excluded from version control via .gitignore.
#
# Usage: ansible-playbook generate_secrets.yml

- name: Generate deployment secrets
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Check if secrets.yml already exists
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/secrets.yml"
      register: secrets_file

    - name: Generate random Postgres password
      ansible.builtin.set_fact:
        postgres_password: "{{ lookup('ansible.builtin.password', '/dev/null', length=32, chars=['ascii_letters', 'digits']) }}"
      when: not secrets_file.stat.exists

    - name: Generate random Django secret key
      ansible.builtin.set_fact:
        django_secret_key: "{{ lookup('ansible.builtin.password', '/dev/null', length=64, chars=['ascii_letters', 'digits', '!@#%^&*(-_=+)']) }}"
      when: not secrets_file.stat.exists

    - name: Generate go-away JWT private key seed (32 bytes / 64 hex chars, shared across all backend nodes)
      ansible.builtin.set_fact:
        go_away_jwt_seed: "{{ lookup('ansible.builtin.password', '/dev/null', length=64, chars=['0123456789abcdef']) }}"
      when: not secrets_file.stat.exists

    - name: Write secrets.yml
      ansible.builtin.copy:
        dest: "{{ playbook_dir }}/secrets.yml"
        mode: "0600"
        content: |
          ---
          # Auto-generated by generate_secrets.yml — DO NOT COMMIT
          postgres_password: "{{ postgres_password }}"
          django_secret_key: "{{ django_secret_key }}"
          # Shared ed25519 seed (hex) for go-away JWT signing — must be identical on every backend node
          # so that challenge cookies issued by one node are accepted by all others under load balancing.
          go_away_jwt_seed: "{{ go_away_jwt_seed }}"
      when: not secrets_file.stat.exists

    - name: Secrets already exist, skipping generation
      ansible.builtin.debug:
        msg: "secrets.yml already exists. Delete it and re-run to rotate the password."
      when: secrets_file.stat.exists
