services:
  db:
    image: postgres:13
    restart: always
    env_file:
      - .env
    volumes:
      - postgres:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      # bind only on the private network interface
      - "172.16.0.2:5432:5432"

  redis:
    image: eqalpha/keydb:latest
    restart: always
    ports:
      # bind only on the private network interface
      - "172.16.0.2:6379:6379"

volumes:
  postgres:
