# Variables for the backend group (instaclone-backend-N)
# postgres_password and django_secret_key are loaded from secrets.yml
# (generated by generate_secrets.yml, gitignored, never committed)
db_host: 172.16.0.2
db_port: 5432
postgres_db: instaclone
postgres_user: instaclone

redis_host: 172.16.0.2
redis_port: 6379

backend_image: idp-angelina-voggenreiter-instaclone-app-instaclone-backend:latest
frontend_image: idp-angelina-voggenreiter-instaclone-app-instaclone-frontend:latest

app_dir: /root/app
tz: Europe/Berlin

# Django
# django_secret_key is injected from secrets.yml — do not set it here
django_allowed_hosts: "*"
django_debug: "False"

